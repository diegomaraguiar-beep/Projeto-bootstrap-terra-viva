<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¡Espera! Tienes un premio</title>
<!-- Cole aqui o script da Utmify (UTMs) e o pixel, se ainda não estiver usando o campo pixelId abaixo -->
<style>
  :root {
    --bg: #0b0d12;
    --bg-2: #131722;
    --card: #171c29;
    --borda: #262d3f;
    --texto: #f3f4f7;
    --texto-2: #a7adbd;
    --ouro: #f5b301;
    --ouro-2: #ffd45c;
    --verde: #18c964;
    --verde-2: #0fa851;
    --vermelho: #ff4d4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--texto); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(245, 179, 1, .18), transparent 70%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .faixa {
    background: var(--vermelho);
    color: #fff;
    text-align: center;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .02em;
    padding: 10px 16px;
    text-transform: uppercase;
  }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 {
    font-size: clamp(24px, 6.4vw, 32px);
    line-height: 1.15;
    text-align: center;
    font-weight: 900;
  }
  h1 .destaque { color: var(--ouro); }
  .sub { color: var(--texto-2); text-align: center; margin: 12px auto 0; max-width: 420px; font-size: 16px; }
  .sub strong { color: var(--texto); }

  /* ---------- Roleta ---------- */
  .roleta-wrap { position: relative; width: min(100%, 380px); margin: 28px auto 0; aspect-ratio: 1; }
  .roleta-wrap::before {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--ouro), var(--ouro-2), var(--ouro), var(--ouro-2), var(--ouro));
    box-shadow: 0 0 40px rgba(245, 179, 1, .35);
  }
  .roleta-wrap::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%; background: var(--bg);
  }
  #roleta {
    position: relative; z-index: 1; width: 100%; height: 100%; display: block;
    transform: rotate(0deg);
    transition: transform 5.2s cubic-bezier(.12, .7, .08, 1);
  }
  .ponteiro {
    position: absolute; z-index: 3; left: 50%; top: -18px; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent; border-right: 18px solid transparent;
    border-top: 34px solid var(--vermelho);
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.5));
  }
  .centro {
    position: absolute; z-index: 2; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 22%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--ouro-2), var(--ouro) 60%, #b98400);
    border: 4px solid var(--bg);
    display: grid; place-items: center;
    font-weight: 900; font-size: 13px; color: #1a1300; text-align: center; line-height: 1.05;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }

  /* ---------- Raspadinha ---------- */
  .raspa-wrap {
    position: relative; margin: 28px auto 0; width: min(100%, 420px); aspect-ratio: 16 / 10;
    border-radius: 18px; overflow: hidden;
    border: 3px dashed var(--ouro);
    background: var(--card);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  .raspa-premio {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 16px;
    background: radial-gradient(circle at 50% 40%, rgba(245,179,1,.22), transparent 70%), var(--card);
  }
  .raspa-premio .mini { color: var(--texto-2); font-size: 13px; text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
  .raspa-premio .grande { color: var(--ouro); font-size: clamp(26px, 8vw, 38px); font-weight: 900; line-height: 1.1; margin-top: 6px; }
  .raspa-premio .linha2 { font-size: 15px; margin-top: 6px; color: var(--texto); font-weight: 600; }
  #raspa-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .6s ease; }
  #raspa-canvas.sumir { opacity: 0; pointer-events: none; }
  .dica { text-align: center; color: var(--texto-2); font-size: 14px; margin-top: 12px; }
  .link-revelar {
    display: block; margin: 8px auto 0; background: none; border: 0; color: var(--ouro); font: inherit;
    font-size: 14px; text-decoration: underline; cursor: pointer; padding: 6px;
  }

  /* ---------- Botões ---------- */
  .btn {
    display: block; width: 100%; max-width: 420px; margin: 24px auto 0;
    border: 0; border-radius: 14px; cursor: pointer;
    padding: 18px 20px; font: inherit; font-size: 19px; font-weight: 900; letter-spacing: .02em;
    text-transform: uppercase; text-align: center; text-decoration: none;
    color: #fff; background: linear-gradient(180deg, var(--verde), var(--verde-2));
    box-shadow: 0 6px 0 #0a7a3a, 0 10px 28px rgba(24, 201, 100, .35);
    transition: transform .08s ease, box-shadow .08s ease, filter .2s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #0a7a3a, 0 6px 16px rgba(24, 201, 100, .3); }
  .btn:disabled { filter: grayscale(.6) brightness(.8); cursor: default; }
  .btn.pulsar { animation: pulsar 1.6s ease-in-out infinite; }
  .btn.ouro { color: #1a1300; background: linear-gradient(180deg, var(--ouro-2), var(--ouro)); box-shadow: 0 6px 0 #a57800, 0 10px 28px rgba(245, 179, 1, .35); }
  .btn.ouro:active { box-shadow: 0 2px 0 #a57800, 0 6px 16px rgba(245, 179, 1, .3); }
  @keyframes pulsar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  .uma-vez { text-align: center; color: var(--texto-2); font-size: 13px; margin-top: 10px; }

  /* ---------- Resultado ---------- */
  #resultado { display: none; margin-top: 28px; }
  #resultado.mostrar { display: block; animation: subir .5s ease both; }
  @keyframes subir { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .card {
    background: var(--card); border: 1px solid var(--borda); border-radius: 18px; padding: 22px 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  .card.ganhou { border: 2px solid var(--ouro); }
  .parabens { text-align: center; color: var(--ouro); font-weight: 900; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; }
  .premio-titulo { text-align: center; font-size: clamp(24px, 7vw, 30px); font-weight: 900; line-height: 1.15; margin-top: 6px; }
  .premio-desc { text-align: center; color: var(--texto-2); margin-top: 8px; font-size: 15px; }
  .lista { list-style: none; margin-top: 18px; display: grid; gap: 10px; }
  .lista li {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--bg-2); border: 1px solid var(--borda); border-radius: 12px; padding: 12px;
    font-size: 15px; font-weight: 600;
  }
  .lista li .ic {
    flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--verde);
    display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 900; margin-top: 1px;
  }
  .lista li .tag { margin-left: auto; flex: none; color: var(--ouro); font-size: 12px; font-weight: 800; text-transform: uppercase; align-self: center; }
  .preco { text-align: center; margin-top: 20px; }
  .preco .de { color: var(--texto-2); text-decoration: line-through; font-size: 17px; }
  .preco .rotulo { color: var(--texto-2); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  .preco .por { font-size: clamp(34px, 10vw, 44px); font-weight: 900; color: var(--verde); line-height: 1.1; }
  .timer {
    margin-top: 18px; text-align: center; background: rgba(255, 77, 79, .1); border: 1px solid rgba(255, 77, 79, .4);
    border-radius: 12px; padding: 10px; font-size: 14px; color: #ffd0d0;
  }
  .timer strong { font-size: 22px; color: #fff; font-variant-numeric: tabular-nums; display: block; letter-spacing: .04em; }
  .selos { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; color: var(--texto-2); font-size: 12.5px; }
  .selos span::before { content: "✓ "; color: var(--verde); font-weight: 900; }
  .expirou .parabens { color: var(--texto-2); }

  #confete { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .esconder { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    #roleta { transition-duration: 1.2s; }
    .btn.pulsar { animation: none; }
  }
</style>
</head>
<body>

<div class="faixa" id="faixa"></div>

<main>
  <section id="jogo">
    <h1 id="titulo"></h1>
    <p class="sub" id="subtitulo"></p>

    <!-- Roleta -->
    <div id="area-roleta" class="esconder">
      <div class="roleta-wrap">
        <div class="ponteiro" aria-hidden="true"></div>
        <svg id="roleta" viewBox="0 0 400 400" role="img" aria-label="Ruleta de premios"></svg>
        <div class="centro" id="centro"></div>
      </div>
      <button class="btn ouro pulsar" id="btn-girar" type="button"></button>
    </div>

    <!-- Raspadinha -->
    <div id="area-raspa" class="esconder">
      <div class="raspa-wrap" id="raspa-wrap">
        <div class="raspa-premio" aria-live="polite">
          <span class="mini" id="raspa-mini"></span>
          <span class="grande" id="raspa-grande"></span>
          <span class="linha2" id="raspa-linha2"></span>
        </div>
        <canvas id="raspa-canvas" aria-label="Tarjeta para raspar"></canvas>
      </div>
      <p class="dica" id="raspa-dica"></p>
      <button class="link-revelar" id="btn-revelar" type="button"></button>
    </div>

    <p class="uma-vez" id="uma-vez"></p>
  </section>

  <section id="resultado" aria-live="polite"></section>
</main>

<canvas id="confete" class="esconder" aria-hidden="true"></canvas>

<script>
/* =====================================================================
   CONFIGURAÇÃO — edite só esta parte
   ===================================================================== */
const CONFIG = {
  // "roleta" ou "raspadinha". Dá pra trocar pela URL também: ?modo=raspadinha
  modo: "roleta",

  produto: "Neuro Honey Protocol",
  garantiaDias: 7,

  // Por quantos minutos o prêmio fica reservado depois de ganhar.
  // Quando o tempo acaba, o botão passa a levar para o checkout normal (checkoutPadrao).
  minutosReserva: 10,

  // Checkout normal da oferta (sem prêmio)
  checkoutPadrao: "https://pay.kashpay.com.br/SEU-CHECKOUT-NORMAL",

  // Pixel da Meta (opcional). Deixe "" se o pixel já estiver no <head>.
  pixelId: "",

  // Prêmios. TODOS que aparecem na roleta precisam ser prêmios de verdade, com checkout próprio.
  // "peso" = chance relativa. Ex.: pesos 70/25/5 → 70%, 25% e 5% de chance.
  premios: [
    {
      id: "bonos",
      rotulo: ["+3 BONOS", "GRATIS"],          // texto na fatia da roleta (2 linhas)
      titulo: "3 Bonos extra por el mismo precio",
      descricao: "Te llevas el protocolo completo + 3 materiales exclusivos que no están en la oferta normal.",
      bonus: [
        "Bono 1: Guía de Recetas Neuro-Nutritivas",
        "Bono 2: Audio de Relajación Profunda",
        "Bono 3: Plan Diario de 21 Días",
      ],
      precoDe: "",                              // vazio = mesmo preço (sem riscado)
      precoPor: "US$ 37",
      checkout: "https://pay.kashpay.com.br/SEU-CHECKOUT-BONUS",
      peso: 70,
      cor: "#1f2a44",
    },
    {
      id: "bonos-desc",
      rotulo: ["+3 BONOS", "+20% OFF"],
      titulo: "3 Bonos extra + 20% de descuento",
      descricao: "El protocolo completo + 3 materiales exclusivos, y además pagas menos.",
      bonus: [
        "Bono 1: Guía de Recetas Neuro-Nutritivas",
        "Bono 2: Audio de Relajación Profunda",
        "Bono 3: Plan Diario de 21 Días",
      ],
      precoDe: "US$ 37",
      precoPor: "US$ 29,60",
      checkout: "https://pay.kashpay.com.br/SEU-CHECKOUT-BONUS-20OFF",
      peso: 25,
      cor: "#5b1f3a",
    },
    {
      id: "vip",
      rotulo: ["+5 BONOS", "+30% OFF"],
      titulo: "5 Bonos extra + 30% de descuento",
      descricao: "El premio mayor: el protocolo completo, 5 materiales exclusivos y el mejor precio.",
      bonus: [
        "Bono 1: Guía de Recetas Neuro-Nutritivas",
        "Bono 2: Audio de Relajación Profunda",
        "Bono 3: Plan Diario de 21 Días",
        "Bono 4: Checklist de Hábitos Matutinos",
        "Bono 5: Acceso a Actualizaciones de por Vida",
      ],
      precoDe: "US$ 37",
      precoPor: "US$ 25,90",
      checkout: "https://pay.kashpay.com.br/SEU-CHECKOUT-VIP",
      peso: 5,
      cor: "#7a5300",
    },
  ],

  // Textos da página (espanhol). Use {produto} para inserir o nome do produto.
  textos: {
    faixa: "¡Espera! No cierres esta página",
    titulo: 'Tienes <span class="destaque">1 oportunidad</span> de ganar un premio exclusivo',
    subRoleta: "Gira la ruleta y descubre qué te llevas junto con el <strong>{produto}</strong>. Todas las casillas tienen premio.",
    subRaspa: "Raspa la tarjeta y descubre qué te llevas junto con el <strong>{produto}</strong>. Todas las tarjetas tienen premio.",
    centroRoleta: "GIRA<br>Y GANA",
    btnGirar: "Girar la ruleta",
    btnGirando: "Girando…",
    raspaDica: "👆 Raspa la tarjeta con el dedo",
    raspaRevelar: "Prefiero revelar sin raspar",
    raspaMini: "Ganaste",
    umaVez: "Solo puedes jugar una vez.",
    parabens: "¡Felicidades! Ganaste",
    rotuloMesmoPreco: "Por el mismo precio",
    rotuloPor: "Hoy por solo",
    timer: "Tu premio está reservado por",
    cta: "Quiero mi premio ahora",
    selos: ["Pago 100% seguro", "Acceso inmediato por email", "Garantía de {garantia} días"],
    tagBonus: "Gratis",
    expirouTitulo: "Tu premio expiró",
    expirouDesc: "Pero todavía puedes acceder al {produto} con el precio normal.",
    expirouCta: "Ver la oferta",
  },
};

/* =====================================================================
   Daqui pra baixo não precisa mexer
   ===================================================================== */
(function () {
  "use strict";

  const T = CONFIG.textos;
  const fill = (s) => String(s)
    .replaceAll("{produto}", CONFIG.produto)
    .replaceAll("{garantia}", CONFIG.garantiaDias);
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const modo = (params.get("modo") || CONFIG.modo) === "raspadinha" ? "raspadinha" : "roleta";
  const premios = CONFIG.premios.filter((p) => p.peso > 0);
  const CHAVE = "premio_v1_" + CONFIG.produto.toLowerCase().replace(/[^a-z0-9]+/g, "-");

  // ---------- Armazenamento (o prêmio fica salvo e não muda se a pessoa recarregar) ----------
  const store = {
    get() { try { return JSON.parse(localStorage.getItem(CHAVE)); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(CHAVE, JSON.stringify(v)); } catch (e) {} },
    clear() { try { localStorage.removeItem(CHAVE); } catch (e) {} },
  };
  if (params.get("reset") === "1") store.clear();

  // ---------- Repassa UTMs e parâmetros de rastreio para o checkout ----------
  function comParams(url) {
    try {
      const u = new URL(url);
      params.forEach((v, k) => {
        if (k === "modo" || k === "reset") return;
        if (!u.searchParams.has(k)) u.searchParams.set(k, v);
      });
      return u.toString();
    } catch (e) { return url; }
  }

  // ---------- Pixel ----------
  function track(evento, dados) {
    if (typeof window.fbq === "function") window.fbq("trackCustom", evento, dados || {});
  }
  if (CONFIG.pixelId) {
    !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = []; t = b.createElement(e); t.async = !0;
      t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
    fbq("init", CONFIG.pixelId);
    fbq("track", "PageView");
  }

  // ---------- Sorteio ponderado ----------
  function sortear() {
    const total = premios.reduce((s, p) => s + p.peso, 0);
    let r = Math.random() * total;
    for (const p of premios) { r -= p.peso; if (r < 0) return p; }
    return premios[premios.length - 1];
  }

  // ---------- Textos fixos ----------
  $("faixa").textContent = fill(T.faixa);
  $("titulo").innerHTML = fill(T.titulo);
  $("subtitulo").innerHTML = fill(modo === "roleta" ? T.subRoleta : T.subRaspa);
  $("uma-vez").textContent = fill(T.umaVez);

  // Já jogou antes? Mostra o resultado direto.
  const salvo = store.get();
  const premioSalvo = salvo && CONFIG.premios.find((p) => p.id === salvo.id);
  if (premioSalvo) {
    $("jogo").classList.add("esconder");
    mostrarResultado(premioSalvo, salvo.expira, false);
    return;
  }

  if (modo === "roleta") iniciarRoleta(); else iniciarRaspadinha();

  /* ================= ROLETA ================= */
  function iniciarRoleta() {
    $("area-roleta").classList.remove("esconder");
    $("centro").innerHTML = fill(T.centroRoleta);
    const btn = $("btn-girar");
    btn.textContent = fill(T.btnGirar);

    // Repete os prêmios até ter pelo menos 6 fatias
    const fatias = [];
    const n = premios.length * Math.ceil(6 / premios.length);
    for (let i = 0; i < n; i++) fatias.push(premios[i % premios.length]);

    const svg = $("roleta");
    const NS = "http://www.w3.org/2000/svg";
    const C = 200, R = 196, a = 360 / n;
    const ponto = (ang, r) => {
      const rad = (ang * Math.PI) / 180;
      return [C + r * Math.sin(rad), C - r * Math.cos(rad)];
    };
    fatias.forEach((p, i) => {
      const ini = i * a - a / 2, fim = i * a + a / 2;
      const [x1, y1] = ponto(ini, R), [x2, y2] = ponto(fim, R);
      const path = document.createElementNS(NS, "path");
      path.setAttribute("d", `M${C},${C} L${x1},${y1} A${R},${R} 0 ${a > 180 ? 1 : 0} 1 ${x2},${y2} Z`);
      path.setAttribute("fill", p.cor || (i % 2 ? "#1f2a44" : "#2a3656"));
      path.setAttribute("stroke", "#f5b301");
      path.setAttribute("stroke-width", "2");
      svg.appendChild(path);

      const g = document.createElementNS(NS, "g");
      g.setAttribute("transform", `rotate(${i * a} ${C} ${C})`);
      const linhas = Array.isArray(p.rotulo) ? p.rotulo : [p.rotulo];
      linhas.forEach((txt, j) => {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", C);
        t.setAttribute("y", 62 + j * 24);
        t.setAttribute("text-anchor", "middle");
        t.setAttribute("fill", j === 0 ? "#ffffff" : "#ffd45c");
        t.setAttribute("font-size", j === 0 ? "19" : "17");
        t.setAttribute("font-weight", "900");
        t.setAttribute("font-family", "system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif");
        t.textContent = txt;
        g.appendChild(t);
      });
      svg.appendChild(g);
    });
    // Bolinhas na borda
    for (let i = 0; i < n * 2; i++) {
      const [cx, cy] = ponto(i * (a / 2), R - 8);
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", 3.2);
      c.setAttribute("fill", i % 2 ? "#ffd45c" : "#ffffff");
      svg.appendChild(c);
    }

    btn.addEventListener("click", () => {
      btn.disabled = true;
      btn.classList.remove("pulsar");
      btn.textContent = fill(T.btnGirando);

      const premio = sortear();
      const indices = fatias.map((p, i) => (p === premio ? i : -1)).filter((i) => i >= 0);
      const alvo = indices[Math.floor(Math.random() * indices.length)];
      const jitter = (Math.random() - 0.5) * a * 0.6;
      const voltas = 6 * 360;
      const rotacao = voltas + ((360 - (alvo * a + jitter)) % 360 + 360) % 360;

      const expira = Date.now() + CONFIG.minutosReserva * 60 * 1000;
      store.set({ id: premio.id, expira });
      track("JogouRoleta", { premio: premio.id });

      svg.style.transform = `rotate(${rotacao}deg)`;
      let feito = false;
      const fim = () => {
        if (feito) return; feito = true;
        setTimeout(() => mostrarResultado(premio, expira, true), 350);
      };
      svg.addEventListener("transitionend", fim, { once: true });
      setTimeout(fim, 6000); // segurança caso o transitionend não dispare
    });
  }

  /* ================= RASPADINHA ================= */
  function iniciarRaspadinha() {
    $("area-raspa").classList.remove("esconder");
    $("raspa-dica").textContent = fill(T.raspaDica);
    $("btn-revelar").textContent = fill(T.raspaRevelar);

    const premio = sortear();
    const linhas = Array.isArray(premio.rotulo) ? premio.rotulo : [premio.rotulo];
    $("raspa-mini").textContent = fill(T.raspaMini);
    $("raspa-grande").textContent = linhas[0] || "";
    $("raspa-linha2").textContent = linhas.slice(1).join(" · ");

    const canvas = $("raspa-canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    let revelado = false, movimentos = 0, ultimo = null, comecou = false;
    const expira = () => Date.now() + CONFIG.minutosReserva * 60 * 1000;

    function pintar() {
      const r = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(r.width * dpr);
      canvas.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = ctx.createLinearGradient(0, 0, r.width, r.height);
      g.addColorStop(0, "#b8bcc6"); g.addColorStop(.35, "#eef0f4"); g.addColorStop(.6, "#a9aeb9"); g.addColorStop(1, "#dfe2e8");
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, r.width, r.height);
      // padrão de pontinhos
      ctx.fillStyle = "rgba(0,0,0,.06)";
      for (let y = 8; y < r.height; y += 14) for (let x = (y / 14) % 2 ? 8 : 15; x < r.width; x += 14) {
        ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = "#4a4f5c";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = `900 ${Math.max(20, r.width * 0.075)}px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif`;
      ctx.fillText("RASPA AQUÍ", r.width / 2, r.height / 2 - 10);
      ctx.font = `700 ${Math.max(13, r.width * 0.038)}px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif`;
      ctx.fillText("y descubre tu premio", r.width / 2, r.height / 2 + 22);
    }
    pintar();

    function raspar(x, y) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineWidth = 46; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath();
      if (ultimo) ctx.moveTo(ultimo.x, ultimo.y); else ctx.moveTo(x - 0.1, y - 0.1);
      ctx.lineTo(x, y);
      ctx.stroke();
      ultimo = { x, y };
      if (++movimentos % 8 === 0) checar();
    }
    function checar() {
      const { width, height } = canvas;
      const dados = ctx.getImageData(0, 0, width, height).data;
      let limpos = 0, total = 0;
      for (let i = 3; i < dados.length; i += 4 * 24) { total++; if (dados[i] === 0) limpos++; }
      if (limpos / total > 0.45) revelar();
    }
    function revelar() {
      if (revelado) return;
      revelado = true;
      canvas.classList.add("sumir");
      $("btn-revelar").classList.add("esconder");
      const exp = expira();
      store.set({ id: premio.id, expira: exp });
      track("RaspouRaspadinha", { premio: premio.id });
      setTimeout(() => mostrarResultado(premio, exp, true), 650);
    }
    const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    canvas.addEventListener("pointerdown", (e) => {
      if (revelado) return;
      canvas.setPointerCapture(e.pointerId);
      comecou = true; ultimo = null;
      const p = pos(e); raspar(p.x, p.y);
    });
    canvas.addEventListener("pointermove", (e) => { if (!comecou || revelado) return; const p = pos(e); raspar(p.x, p.y); });
    const parar = () => { comecou = false; ultimo = null; if (!revelado) checar(); };
    canvas.addEventListener("pointerup", parar);
    canvas.addEventListener("pointercancel", parar);
    $("btn-revelar").addEventListener("click", revelar);
    window.addEventListener("resize", () => { if (!revelado && movimentos === 0) pintar(); });
  }

  /* ================= RESULTADO ================= */
  function mostrarResultado(premio, expira, comemorar) {
    const box = $("resultado");
    const expirou = Date.now() >= expira;
    ["btn-girar", "raspa-dica", "btn-revelar", "uma-vez"].forEach((id) => $(id).classList.add("esconder"));

    if (expirou) {
      box.innerHTML = `
        <div class="card expirou">
          <p class="parabens">${fill(T.expirouTitulo)}</p>
          <p class="premio-desc">${fill(T.expirouDesc)}</p>
          <a class="btn" href="${comParams(CONFIG.checkoutPadrao)}">${fill(T.expirouCta)}</a>
        </div>`;
      box.classList.add("mostrar");
      return;
    }

    const mesmoPreco = !premio.precoDe || premio.precoDe === premio.precoPor;
    const bonus = premio.bonus.map((b) => `
      <li><span class="ic">✓</span><span>${b}</span><span class="tag">${fill(T.tagBonus)}</span></li>`).join("");
    const selos = T.selos.map((s) => `<span>${fill(s)}</span>`).join("");

    box.innerHTML = `
      <div class="card ganhou">
        <p class="parabens">🎉 ${fill(T.parabens)}</p>
        <h2 class="premio-titulo">${premio.titulo}</h2>
        <p class="premio-desc">${premio.descricao}</p>
        <ul class="lista">${bonus}</ul>
        <div class="preco">
          ${mesmoPreco
            ? `<div class="rotulo">${fill(T.rotuloMesmoPreco)}</div>`
            : `<div class="de">${premio.precoDe}</div><div class="rotulo">${fill(T.rotuloPor)}</div>`}
          <div class="por">${premio.precoPor}</div>
        </div>
        <div class="timer">${fill(T.timer)}<strong id="relogio">--:--</strong></div>
        <a class="btn pulsar" id="cta" href="${comParams(premio.checkout)}">${fill(T.cta)}</a>
        <div class="selos">${selos}</div>
      </div>`;
    box.classList.add("mostrar");
    $("cta").addEventListener("click", () => track("ResgatouPremio", { premio: premio.id }));

    const relogio = $("relogio");
    const tick = () => {
      const resta = expira - Date.now();
      if (resta <= 0) { clearInterval(iv); mostrarResultado(premio, expira, false); return; }
      const m = Math.floor(resta / 60000), s = Math.floor((resta % 60000) / 1000);
      relogio.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    };
    const iv = setInterval(tick, 1000);
    tick();

    if (comemorar) {
      confete();
      box.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }

  /* ================= CONFETE ================= */
  function confete() {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("confete");
    cv.classList.remove("esconder");
    const ctx = cv.getContext("2d");
    const W = cv.width = innerWidth, H = cv.height = innerHeight;
    const cores = ["#f5b301", "#ffd45c", "#18c964", "#ffffff", "#ff4d4f", "#4da3ff"];
    const ps = Array.from({ length: 140 }, () => ({
      x: W / 2 + (Math.random() - .5) * 80, y: H * .35,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
      s: Math.random() * 6 + 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3,
      c: cores[Math.floor(Math.random() * cores.length)],
    }));
    const ini = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, W, H);
      ps.forEach((p) => {
        p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      if (t - ini < 3200) requestAnimationFrame(frame);
      else { ctx.clearRect(0, 0, W, H); cv.classList.add("esconder"); }
    })(ini);
  }
})();
</script>
